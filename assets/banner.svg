<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Muhammad Rizki Hasan</title>
  <desc id="bannerDesc">Banner profil Muhammad Rizki Hasan, mahasiswa Teknik Informatika dan bagian dari HIMA TI.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0F0C" />
      <stop offset="0.55" stop-color="#0D1612" />
      <stop offset="1" stop-color="#122019" />
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1020 80) scale(620 440)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE7B7" stop-opacity="0.16" />
      <stop offset="1" stop-color="#6EE7B7" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" />
    </pattern>

    <clipPath id="card">
      <rect width="1200" height="400" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#bg)" />
    <rect width="1200" height="400" fill="url(#grid)" />
    <rect width="1200" height="400" fill="url(#glow)" />

    <!-- Orbit mark -->
    <g>
      <circle cx="1010" cy="196" r="94" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" />
      <circle cx="1010" cy="196" r="136" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" />
      <circle cx="1010" cy="196" r="168" fill="none" stroke="#6EE7B7" stroke-opacity="0.28" stroke-dasharray="1 12" stroke-linecap="round" />
      <circle cx="1010" cy="196" r="136" fill="none" stroke="#6EE7B7" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" stroke-dasharray="132 722" transform="rotate(-38 1010 196)" />
      <circle cx="1010" cy="60" r="10" fill="#6EE7B7" fill-opacity="0.12" />
      <circle cx="1010" cy="60" r="3.5" fill="#6EE7B7" />
    </g>

    <text x="1010" y="211" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" letter-spacing="6" fill="#F4F1EA">MRH</text>
    <text x="1010" y="244" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="9" letter-spacing="3.4" fill="#8CA79B">SEJAK 2026</text>

    <!-- Left content -->
    <rect x="72" y="72" width="26" height="2" fill="#6EE7B7" />
    <text x="112" y="79" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="4.2" fill="#8CA79B">TEKNIK INFORMATIKA · HIMA TI</text>

    <text x="72" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="64" letter-spacing="-1" fill="#F4F1EA">Muhammad Rizki Hasan</text>

    <rect x="72" y="236" width="64" height="2" fill="#6EE7B7" />

    <text x="72" y="282" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#D7E3DA">Mahasiswa Teknik Informatika</text>
    <text x="72" y="313" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1.4" fill="#8CA79B">Himpunan Mahasiswa Teknik Informatika</text>

    <!-- Footer -->
    <line x1="72" y1="350" x2="1128" y2="350" stroke="#FFFFFF" stroke-opacity="0.08" />
    <text x="72" y="379" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#7E968A">github.com/muhammadrizkihasan</text>
    <text x="1128" y="379" text-anchor="end" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="2.4" fill="#7E968A">BELAJAR · MEMBANGUN · BERBAGI</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="399" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" />
</svg>
