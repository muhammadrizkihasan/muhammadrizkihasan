<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Muhammad Rizki Hasan — Personal Banner</title>
  <desc id="bannerDesc">Banner profil Muhammad Rizki Hasan, Mahasiswa Teknologi Informasi dan bagian dari HIMA TI.</desc>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Plus Jakarta Sans', Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SFMono-Regular', Consolas, monospace;
    }

    /* Ambient Pulsing Animations */
    @keyframes pulse-glow {
      0%, 100% { opacity: 0.28; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.04); }
    }
    @keyframes slow-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes reverse-spin {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .anim-pulse {
      animation: blink 2.4s ease-in-out infinite;
    }
    .anim-spin {
      transform-origin: 900px 175px;
      animation: slow-spin 48s linear infinite;
    }
    .anim-spin-reverse {
      transform-origin: 900px 175px;
      animation: reverse-spin 60s linear infinite;
    }
  </style>

  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050806" />
      <stop offset="35%" stop-color="#0A130E" />
      <stop offset="70%" stop-color="#07100B" />
      <stop offset="100%" stop-color="#040605" />
    </linearGradient>

    <!-- Ambient Aurora Blooms -->
    <radialGradient id="auroraEmerald" cx="78%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#059669" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraCyan" cx="88%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraLeft" cx="12%" cy="18%" r="42%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </radialGradient>

    <!-- Typography Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>

    <!-- Glass Terminal Gradients -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D1A14" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#07100C" stop-opacity="0.90" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#34D399" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.15" />
    </linearGradient>

    <!-- Sleek Line Gradient -->
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="15%" stop-color="#6EE7B7" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="85%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Outer Canvas Stroke Gradient -->
    <linearGradient id="canvasBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="75%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Technical Grid Pattern with Dots -->
    <pattern id="gridPattern" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#FFFFFF" stroke-opacity="0.025" stroke-width="1" />
      <circle cx="34" cy="34" r="1" fill="#6EE7B7" fill-opacity="0.14" />
    </pattern>

    <!-- Grid Radial Mask -->
    <radialGradient id="gridMaskMap" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <mask id="gridMask">
      <rect width="1200" height="400" fill="url(#gridMaskMap)" />
    </mask>

    <!-- Drop Shadows -->
    <filter id="shadowWindow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#022C22" flood-opacity="0.4" />
    </filter>

    <filter id="shadowPill" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10B981" flood-opacity="0.3" />
    </filter>

    <!-- Card Clip Boundary -->
    <clipPath id="boundaryClip">
      <rect width="1200" height="400" rx="20" />
    </clipPath>
  </defs>

  <!-- ==================== MAIN BANNER CANVAS ==================== -->
  <g clip-path="url(#boundaryClip)">
    <!-- Base Background -->
    <rect width="1200" height="400" fill="url(#bgGrad)" />

    <!-- Ambient Aurora Glows -->
    <rect width="1200" height="400" fill="url(#auroraEmerald)" />
    <rect width="1200" height="400" fill="url(#auroraCyan)" />
    <rect width="1200" height="400" fill="url(#auroraLeft)" />

    <!-- Technical Grid Pattern -->
    <rect width="1200" height="400" fill="url(#gridPattern)" mask="url(#gridMask)" />

    <!-- Rotating Tech Orbital Rings (Aesthetic Background Behind Terminal) -->
    <g class="anim-spin" opacity="0.4">
      <circle cx="900" cy="175" r="185" fill="none" stroke="#6EE7B7" stroke-opacity="0.14" stroke-width="1.2" stroke-dasharray="3 8" />
      <circle cx="900" cy="175" r="140" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1" />
      <!-- Small orbital satellite node -->
      <circle cx="1085" cy="175" r="4" fill="#34D399" fill-opacity="0.7" />
    </g>

    <g class="anim-spin-reverse" opacity="0.3">
      <ellipse cx="900" cy="175" rx="215" ry="90" fill="none" stroke="#38BDF8" stroke-opacity="0.16" stroke-dasharray="8 14" />
      <circle cx="685" cy="175" r="3" fill="#38BDF8" fill-opacity="0.6" />
    </g>

    <!-- Aesthetic Decorative Crosshairs and Star Glyphs -->
    <g opacity="0.5">
      <!-- Target crosshairs -->
      <path d="M 645 28 L 645 40 M 639 34 L 651 34" stroke="#6EE7B7" stroke-opacity="0.4" stroke-width="1" />
      <path d="M 1130 140 L 1130 152 M 1124 146 L 1136 146" stroke="#6EE7B7" stroke-opacity="0.4" stroke-width="1" />
      <path d="M 630 310 L 630 318 M 626 314 L 634 314" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />
      
      <!-- Tech star sparkles -->
      <path d="M 660 90 Q 660 96 666 96 Q 660 96 660 102 Q 660 96 654 96 Q 660 96 660 90 Z" fill="#6EE7B7" fill-opacity="0.65" />
      <path d="M 1145 80 Q 1145 85 1150 85 Q 1145 85 1145 90 Q 1145 85 1140 85 Q 1145 85 1145 80 Z" fill="#38BDF8" fill-opacity="0.6" />
    </g>

    <!-- High-Tech Viewfinder Corner Brackets -->
    <g stroke="#6EE7B7" stroke-opacity="0.35" stroke-width="1.5" fill="none">
      <path d="M 40 52 L 40 40 L 52 40" />
      <path d="M 1160 52 L 1160 40 L 1148 40" />
      <path d="M 40 348 L 40 360 L 52 360" />
      <path d="M 1160 348 L 1160 360 L 1148 360" />
    </g>

    <!-- ==================== LEFT COLUMN: PROFILE & BRANDING ==================== -->

    <!-- Status Capsule Tag -->
    <g transform="translate(68, 46)">
      <rect width="288" height="28" rx="14" fill="#0C1B14" fill-opacity="0.8" stroke="#34D399" stroke-opacity="0.32" stroke-width="1" />
      
      <!-- Pulsing Dot -->
      <circle cx="16" cy="14" r="5" fill="#34D399" fill-opacity="0.25" class="anim-pulse" />
      <circle cx="16" cy="14" r="2.5" fill="#34D399" />
      
      <text x="30" y="18" class="font-mono" font-size="10.5" font-weight="600" letter-spacing="2.6" fill="#A7F3D0">
        TEKNOLOGI INFORMASI · HIMA TI
      </text>
    </g>

    <!-- Hero Name Headline -->
    <text x="68" y="122" class="font-sans" font-size="46" font-weight="800" letter-spacing="-1.2" fill="url(#textGrad)">
      Muhammad Rizki Hasan
    </text>

    <!-- Role & Department Subtitle -->
    <g transform="translate(70, 154)">
      <text x="0" y="0" class="font-sans" font-size="18" font-weight="600" fill="#F1F5F9" letter-spacing="0.2">
        Mahasiswa Teknologi Informasi
      </text>
      <text x="0" y="24" class="font-sans" font-size="14.5" font-weight="500" fill="#94A3B8">
        Himpunan Mahasiswa Teknologi Informasi (HIMA TI)
      </text>
    </g>

    <!-- Bio Philosophy Tagline -->
    <g transform="translate(70, 214)">
      <text x="0" y="0" class="font-sans" font-size="13.5" font-weight="400" fill="#9FB4A9">
        "Membaca secukupnya, menulis kode, dan terus memperbaiki."
      </text>
      <text x="0" y="20" class="font-sans" font-size="12.5" font-weight="400" fill="#6B887B">
        Fokus pada fondasi CS, antarmuka web yang bersih, dan kebiasaan rapi.
      </text>
    </g>

    <!-- Focus Badges (Sleek Glass Pills) -->
    <g transform="translate(68, 268)">
      <!-- Badge 1: CS Foundations -->
      <g transform="translate(0, 0)">
        <rect width="134" height="30" rx="8" fill="#0C1913" fill-opacity="0.85" stroke="#34D399" stroke-opacity="0.25" stroke-width="1" />
        <text x="14" y="19" class="font-mono" font-size="11" font-weight="600" fill="#D1FAE5">
          <tspan fill="#6EE7B7">{ }</tspan>  CS Basics
        </text>
      </g>

      <!-- Badge 2: Web Dev -->
      <g transform="translate(144, 0)">
        <rect width="124" height="30" rx="8" fill="#0C1913" fill-opacity="0.85" stroke="#34D399" stroke-opacity="0.25" stroke-width="1" />
        <text x="14" y="19" class="font-mono" font-size="11" font-weight="600" fill="#D1FAE5">
          <tspan fill="#38BDF8">&lt;/&gt;</tspan>  Web Dev
        </text>
      </g>

      <!-- Badge 3: Clean Code -->
      <g transform="translate(278, 0)">
        <rect width="130" height="30" rx="8" fill="#0C1913" fill-opacity="0.85" stroke="#34D399" stroke-opacity="0.25" stroke-width="1" />
        <text x="14" y="19" class="font-mono" font-size="11" font-weight="600" fill="#D1FAE5">
          <tspan fill="#FDE68A">⚡</tspan>  Clean Code
        </text>
      </g>

      <!-- Badge 4: Open Collab -->
      <g transform="translate(418, 0)">
        <rect width="136" height="30" rx="8" fill="#0C1913" fill-opacity="0.85" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="1" />
        <text x="14" y="19" class="font-mono" font-size="11" font-weight="600" fill="#BAE6FD">
          <tspan fill="#38BDF8">✦</tspan>  Open Collab
        </text>
      </g>
    </g>


    <!-- ==================== RIGHT COLUMN: GLASS TERMINAL WINDOW ==================== -->

    <g transform="translate(680, 46)">
      <!-- Main Glass Window Frame -->
      <rect width="450" height="248" rx="14" fill="url(#glassBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#shadowWindow)" />

      <!-- Window Header Bar -->
      <rect width="450" height="36" rx="14" fill="#08140E" fill-opacity="0.75" />
      <rect y="22" width="450" height="14" fill="#08140E" fill-opacity="0.75" />
      <line x1="0" y1="36" x2="450" y2="36" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

      <!-- Mac-style Traffic Light Buttons -->
      <circle cx="20" cy="18" r="5" fill="#EF4444" fill-opacity="0.85" />
      <circle cx="36" cy="18" r="5" fill="#F59E0B" fill-opacity="0.85" />
      <circle cx="52" cy="18" r="5" fill="#10B981" fill-opacity="0.85" />

      <!-- Active File Tab -->
      <g transform="translate(70, 7)">
        <rect width="136" height="22" rx="5" fill="#112219" stroke="#1D3A2C" stroke-width="0.8" />
        <text x="10" y="15" class="font-mono" font-size="10.5" fill="#34D399">&lt;&gt;</text>
        <text x="28" y="15" class="font-mono" font-size="11" font-weight="500" fill="#E2E8F0">profile.config.ts</text>
      </g>

      <!-- Git Branch Indicator -->
      <text x="432" y="22" text-anchor="end" class="font-mono" font-size="10" fill="#64748B">
        git:(<tspan fill="#34D399">main</tspan>) ✓
      </text>

      <!-- Code Snippet Body (Syntax Highlighted) -->
      <g transform="translate(20, 56)" class="font-mono" font-size="12" letter-spacing="0">
        <!-- Line 1 -->
        <text y="16">
          <tspan fill="#475569" font-size="10">01 </tspan>
          <tspan fill="#F472B6" font-weight="600">const </tspan>
          <tspan fill="#38BDF8">developer </tspan>
          <tspan fill="#94A3B8">= </tspan>
          <tspan fill="#F8FAFC">{</tspan>
        </text>

        <!-- Line 2 -->
        <text y="38">
          <tspan fill="#475569" font-size="10">02 </tspan>
          <tspan fill="#94A3B8">  name: </tspan>
          <tspan fill="#FDE68A">"Muhammad Rizki Hasan"</tspan>
          <tspan fill="#94A3B8">,</tspan>
        </text>

        <!-- Line 3 -->
        <text y="60">
          <tspan fill="#475569" font-size="10">03 </tspan>
          <tspan fill="#94A3B8">  major: </tspan>
          <tspan fill="#FDE68A">"Teknologi Informasi"</tspan>
          <tspan fill="#94A3B8">,</tspan>
        </text>

        <!-- Line 4 -->
        <text y="82">
          <tspan fill="#475569" font-size="10">04 </tspan>
          <tspan fill="#94A3B8">  org: </tspan>
          <tspan fill="#A7F3D0">"HIMA TI"</tspan>
          <tspan fill="#94A3B8">,</tspan>
        </text>

        <!-- Line 5 -->
        <text y="104">
          <tspan fill="#475569" font-size="10">05 </tspan>
          <tspan fill="#94A3B8">  focus: [</tspan>
          <tspan fill="#FDE68A">"CS"</tspan>
          <tspan fill="#94A3B8">, </tspan>
          <tspan fill="#FDE68A">"WebDev"</tspan>
          <tspan fill="#94A3B8">, </tspan>
          <tspan fill="#FDE68A">"CleanCode"</tspan>
          <tspan fill="#94A3B8">],</tspan>
        </text>

        <!-- Line 6 -->
        <text y="126">
          <tspan fill="#475569" font-size="10">06 </tspan>
          <tspan fill="#94A3B8">  motto: </tspan>
          <tspan fill="#6EE7B7">"Selesai &gt; Sempurna"</tspan>
        </text>

        <!-- Line 7 -->
        <text y="148">
          <tspan fill="#475569" font-size="10">07 </tspan>
          <tspan fill="#F8FAFC">};</tspan>
        </text>

        <!-- Line 8 -->
        <text y="170">
          <tspan fill="#475569" font-size="10">08 </tspan>
          <tspan fill="#F472B6" font-weight="600">export default </tspan>
          <tspan fill="#38BDF8">developer</tspan>
          <tspan fill="#F8FAFC">;</tspan>
        </text>
      </g>
    </g>

    <!-- Floating 3D Depth Pill (Overlapping Window) -->
    <g transform="translate(934, 274)" filter="url(#shadowPill)">
      <rect width="182" height="34" rx="17" fill="#091811" stroke="#34D399" stroke-opacity="0.8" stroke-width="1.2" />
      <circle cx="18" cy="17" r="4.5" fill="#34D399" fill-opacity="0.25" class="anim-pulse" />
      <circle cx="18" cy="17" r="2.5" fill="#34D399" />
      <text x="32" y="21" class="font-mono" font-size="10.5" font-weight="700" letter-spacing="1.8" fill="#D1FAE5">
        SEJAK 2026 · AKTIF
      </text>
    </g>


    <!-- ==================== FOOTER SECTION ==================== -->

    <!-- Fine Gradient Divider Line -->
    <line x1="68" y1="340" x2="1132" y2="340" stroke="url(#dividerGrad)" stroke-width="1.2" />

    <!-- Left Footer: GitHub Profile Handle with Octocat -->
    <g transform="translate(68, 372)">
      <!-- Official GitHub Octocat Vector Path -->
      <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" transform="translate(0, -11) scale(0.65)" fill="#6EE7B7" fill-opacity="0.85" />
      <text x="24" y="1" class="font-mono" font-size="11.5" font-weight="500" fill="#8FA69A">
        github.com/muhammadrizkihasan
      </text>
    </g>

    <!-- Center Footer: Location & Academic Coordinates -->
    <g transform="translate(600, 372)" text-anchor="middle">
      <text y="1" class="font-mono" font-size="10.5" letter-spacing="2.6" fill="#4E6B5D">
        INDONESIA · INFORMATION TECHNOLOGY
      </text>
    </g>

    <!-- Right Footer: Motto with emerald accent bullets -->
    <g transform="translate(1132, 372)" text-anchor="end">
      <text y="1" class="font-mono" font-size="11" font-weight="600" letter-spacing="2.2" fill="#8FA69A">
        BELAJAR <tspan fill="#34D399">·</tspan> MEMBANGUN <tspan fill="#34D399">·</tspan> BERBAGI
      </text>
    </g>
  </g>

  <!-- High-Precision Card Outer Border with Gradient Stroke -->
  <rect x="0.6" y="0.6" width="1198.8" height="398.8" rx="19.4" fill="none" stroke="url(#canvasBorder)" stroke-width="1.2" />
</svg>
